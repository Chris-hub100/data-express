<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Westruck Operations | Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #0f172a;
            --brand-light: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #ffffff;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* ── BACKGROUND GRID ── */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(15,23,42,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(15,23,42,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── AMBIENT GLOW (bottom) ── */
        body::after {
            content: '';
            position: fixed;
            bottom: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 350px;
            background: radial-gradient(ellipse, rgba(15,23,42,0.07) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── CARD ── */
        .login-card {
            position: relative; z-index: 10;
            width: 100%; max-width: 420px;
            margin: 1rem;
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow:
                0 0 0 1px rgba(15,23,42,0.08),
                0 30px 60px -12px rgba(15,23,42,0.35),
                0 6px 20px -4px rgba(15,23,42,0.2),
                inset 0 1px 0 rgba(255,255,255,0.06);
        }

        /* ── LOGO MARK ── */
        .logo-mark {
            width: 48px; height: 48px;
            background: #ffffff;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #0f172a;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px -4px rgba(255,255,255,0.2);
        }

        /* ── HEADINGS ── */
        .login-title {
            font-size: 1.25rem; font-weight: 900;
            letter-spacing: -0.5px; text-transform: uppercase;
            line-height: 1.2; margin-bottom: 0.35rem;
            color: #ffffff;
        }
        .login-sub {
            font-size: 0.7rem; font-weight: 700;
            color: rgba(255,255,255,0.3); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 2rem;
        }

        /* ── DIVIDER ── */
        .divider {
            height: 1px; background: rgba(255,255,255,0.07);
            margin-bottom: 1.75rem;
        }

        /* ── FIELD ── */
        .field-label {
            display: block;
            font-size: 0.6rem; font-weight: 900;
            color: rgba(255,255,255,0.3); text-transform: uppercase;
            letter-spacing: 1.5px; margin-bottom: 0.5rem;
        }
        .field-wrap {
            position: relative; margin-bottom: 1rem;
        }
        .field-wrap i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.2); font-size: 14px;
            pointer-events: none; transition: color 0.2s;
        }
        .field-wrap:focus-within i { color: rgba(255,255,255,0.7); }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 14px 12px 40px;
            color: #ffffff; font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem; font-weight: 600;
            outline: none;
            transition: all 0.2s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
        }
        input::placeholder { color: rgba(255,255,255,0.2); font-weight: 500; }

        /* ── NODE SELECT ── */
        .node-select-wrap {
            position: relative; margin-bottom: 1.5rem;
        }
        .node-select-wrap i {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.2); font-size: 14px;
            pointer-events: none; transition: color 0.2s;
        }
        .node-select-wrap:focus-within i { color: rgba(255,255,255,0.7); }

        select {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 14px 12px 40px;
            color: #ffffff; font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem; font-weight: 600;
            outline: none; cursor: pointer;
            appearance: none;
            transition: all 0.2s;
        }
        select:focus {
            border-color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.06);
        }
        select option { background: #1e293b; color: white; }

        /* ── SHOW PASSWORD TOGGLE ── */
        .show-pw {
            position: absolute; right: 12px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: white !important; font-size: 14px;
            padding: 4px; transition: color 0.2s;
        }
        .show-pw:hover { color: rgba(255,255,255,0.6); }
        .show-pw i {color: white !important}

        /* ── ERROR STATE ── */
        .error-banner {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 1rem;
            display: none;
            align-items: center; gap: 8px;
        }
        .error-banner.visible { display: flex; }
        .error-banner i { color: #ef4444; font-size: 13px; flex-shrink: 0; }
        .error-banner p {
            font-size: 0.7rem; font-weight: 700;
            color: #fca5a5; text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* ── SUBMIT BUTTON ── */
        .btn-login {
            width: 100%;
            background: #ffffff;
            color: #0f172a;
            border: none; cursor: pointer;
            border-radius: 12px;
            padding: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.7rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
            transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 8px 24px -4px rgba(255,255,255,0.2);
            position: relative; overflow: hidden;
        }
        .btn-login::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 14px 32px -4px rgba(255,255,255,0.3);
            background: #f1f5f9;
        }
        .btn-login:active:not(:disabled) { transform: translateY(0); }
        .btn-login:disabled {
            opacity: 0.4; cursor: not-allowed; transform: none;
            box-shadow: none;
        }

        /* ── LOADING SPINNER ── */
        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(15,23,42,0.2);
            border-top-color: #0f172a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-login.loading .spinner { display: block; }
        .btn-login.loading .btn-text { opacity: 0.6; }

        /* ── STATUS FOOTER ── */
        .status-footer {
            margin-top: 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
        }
        .status-dot {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.6rem; font-weight: 700;
            color: rgba(255,255,255,0.25); text-transform: uppercase; letter-spacing: 1px;
        }
        .status-dot::before {
            content: '';
            width: 6px; height: 6px; border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .support-link {
            font-size: 0.6rem; font-weight: 700;
            color: white; text-transform: uppercase;
            letter-spacing: 1px; text-decoration: none;
            transition: color 0.2s;
        }
        .support-link:hover { color: rgba(255,255,255,0.7); }

        /* ── ANIMATIONS ── */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card { animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }

        /* Ensure the modal is at the absolute top of the stack */
#supportModal {
    z-index: 999999 !important;
}

/* Ensure the login card stays below the modal's backdrop */
.login-card {
    z-index: 10;
}

/* Fix for mobile stacking contexts */
body {
    position: relative;
}

        /* ── SESSION EXPIRED BANNER ── */
        .session-expired {
            background: rgba(245,158,11,0.1);
            border: 1px solid rgba(245,158,11,0.25);
            border-radius: 10px;
            padding: 10px 14px; margin-bottom: 1rem;
            display: none; align-items: center; gap: 8px;
        }
        .session-expired.visible { display: flex; }
        .session-expired i { color: #f59e0b; font-size: 13px; flex-shrink: 0; }
        .session-expired p {
            font-size: 0.7rem; font-weight: 700;
            color: #fcd34d; text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* ── MOBILE ── */
        @media (max-width: 480px) {
            .login-card { padding: 1.75rem; }
        }
    </style>
</head>
<body>

    <div class="login-card">

        <!-- Logo -->
        <div class="logo-mark">
            <i class="bi bi-gear-fill"></i>
        </div>

        <!-- Header -->
        <h1 class="login-title">Westruck Operations</h1>
        <p class="login-sub">Secure dispatcher access</p>
        <div class="divider"></div>

        <!-- Session expired notice (shown when redirected from expired session) -->
        <div class="session-expired" id="sessionExpiredBanner">
            <i class="bi bi-clock-history"></i>
            <p>Session expired — please sign in again</p>
        </div>

        <!-- Error banner -->
        <div class="error-banner" id="errorBanner">
            <i class="bi bi-shield-x"></i>
            <p id="errorMsg">Invalid credentials</p>
        </div>

        <!-- Node (firm) selector -->
        <label class="field-label">Operational Node</label>
        <div class="node-select-wrap">
            <i class="bi bi-building"></i>
            <select id="nodeSelect">
                <option value="">— Select your firm —</option>
            </select>
        </div>

        <!-- Dispatcher ID -->
        <label class="field-label">Dispatcher ID</label>
        <div class="field-wrap">
            <i class="bi bi-person-badge"></i>
            <input type="text" id="dispatcherId" placeholder="Your dispatcher ID"
                autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>

        <!-- PIN / Password -->
        <label class="field-label">Access PIN</label>
        <div class="field-wrap" style="margin-bottom:1.5rem;">
            <i class="bi bi-lock"></i>
            <input type="password" id="accessPin" placeholder="••••••••"
                autocomplete="current-password"
                onkeydown="if(event.key==='Enter') attemptLogin()">
            <button class="show-pw" onclick="togglePinVisibility()" id="togglePwBtn" type="button">
                <!--i class="bi bi-eye" id="eyeIcon"></i-->
            </button>
        </div>

        <!-- Submit -->
        <button class="btn-login" id="loginBtn" onclick="attemptLogin()">
            <div class="spinner" id="loginSpinner"></div>
            <span class="btn-text">Authenticate Session</span>
            <i class="bi bi-arrow-right-short" style="font-size:16px;"></i>
        </button>

        <!-- Footer -->
        <div class="status-footer">
            <span class="status-dot">Auth Gateway Online</span>
            <button type="button" onclick="openSupportModal()" class="support-link border-none bg-transparent cursor-pointer">
    <i class="bi bi-headset me-1"></i> Support
</button>
        </div>

    </div>

    <div id="supportModal" class="fixed inset-0 z- hidden flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-xl animate-fade">
    <div class="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-blue-100">
                <i class="bi bi-person-badge-fill text-blue-600 text-2xl"></i>
            </div>
            <h4 class="text-xl font-black uppercase tracking-tighter text-slate-900">Platform Support</h4>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Ledgehold</p>
        </div>

        <div class="space-y-4">
            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 group">
                <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">WhatsApp & Voice</p>
                <div class="flex justify-between items-center">
                    <span class="font-black text-sm text-slate-700">+233 55 168 1706</span>
                    <a href="https://wa.me/233551681706" target="_blank" class="w-8 h-8 bg-emerald-500 text-white rounded-lg flex items-center justify-center shadow-lg shadow-emerald-100 hover:scale-110 transition-transform">
                        <i class="bi bi-whatsapp"></i>
                    </a>
                </div>
            </div>

            <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 group">
                <p class="text-[8px] font-black text-slate-400 uppercase tracking-widest mb-1">Direct Email</p>
                <div class="flex justify-between items-center">
                    <span class="font-black text-sm text-slate-700">chris@ledgehold.xyz</span>
                    <a href="mailto:support@westruck.xyz" class="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center shadow-lg shadow-blue-100 hover:scale-110 transition-transform">
                        <i class="bi bi-envelope-fill"></i>
                    </a>
                </div>
            </div>
        </div>

        <button type="button" onclick="closeSupportModal()" class="w-full mt-8 py-4 rounded-2xl bg-slate-900 text-white font-black uppercase text-[10px] tracking-[0.2em] shadow-xl hover:bg-slate-800 transition-all">
            Return to Login
        </button>
    </div>
</div>

    <script>
        // ============================================================
        // CONFIGURATION — reads node from URL ?node= param
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const nodeParam = urlParams.get('node');
        const expiredParam = urlParams.get('reason');

        if (expiredParam === 'expired') {
            document.getElementById('sessionExpiredBanner').classList.add('visible');
            const cleanUrl = new URL(window.location.href);
            cleanUrl.searchParams.delete('reason');
            window.history.replaceState({}, document.title, cleanUrl.toString());
            setTimeout(() => {
                const banner = document.getElementById('sessionExpiredBanner');
                banner.style.transition = 'opacity 1s ease';
                banner.style.opacity = '0';
                setTimeout(() => banner.classList.remove('visible'), 1000);
            }, 15000);
        }

        const KNOWN_NODES = [
            { id: 'westruck-logistics', label: 'Westruck Logistics' },
        ];

        const nodeSelect = document.getElementById('nodeSelect');
        KNOWN_NODES.forEach(node => {
            const opt = document.createElement('option');
            opt.value = node.id;
            opt.textContent = node.label;
            if (nodeParam && nodeParam === node.id) opt.selected = true;
            nodeSelect.appendChild(opt);
        });

        if (KNOWN_NODES.length === 1) {
            nodeSelect.value = KNOWN_NODES[0].id;
            nodeSelect.closest('.node-select-wrap').style.display = 'none';
            nodeSelect.previousElementSibling.style.display = 'none';
        }

        // ============================================================
        // TOGGLE PIN VISIBILITY
        // ============================================================
        function togglePinVisibility() {
            const input = document.getElementById('accessPin');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        // ============================================================
        // ERROR DISPLAY
        // ============================================================
        function showError(msg) {
            const banner = document.getElementById('errorBanner');
            document.getElementById('errorMsg').textContent = msg;
            banner.classList.add('visible');
            const card = document.querySelector('.login-card');
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'shake 0.4s ease';
        }

        function clearError() {
            document.getElementById('errorBanner').classList.remove('visible');
        }

        const shakeStyle = document.createElement('style');
        shakeStyle.textContent = `
            @keyframes shake {
                0%,100% { transform: translateX(0); }
                20% { transform: translateX(-8px); }
                40% { transform: translateX(8px); }
                60% { transform: translateX(-5px); }
                80% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(shakeStyle);

        // ============================================================
        // LOGIN ATTEMPT
        // ============================================================
        async function attemptLogin() {
            clearError();

            const nodeId   = document.getElementById('nodeSelect').value;
            const dispId   = document.getElementById('dispatcherId').value.trim();
            const pin      = document.getElementById('accessPin').value;
            const btn      = document.getElementById('loginBtn');

            if (!nodeId)  { showError('Select your operational node'); return; }
            if (!dispId)  { showError('Dispatcher ID is required'); return; }
            if (!pin)     { showError('Access PIN is required'); return; }

            btn.disabled = true;
            btn.classList.add('loading');
            document.getElementById('loginSpinner').style.display = 'block';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nodeId, dispatcherId: dispId, pin })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    sessionStorage.setItem('lh_token', result.token);
                    sessionStorage.setItem('lh_node', nodeId);
                    sessionStorage.setItem('lh_role', result.role);
                    sessionStorage.setItem('lh_dispatcher', result.displayName || dispId);
                    sessionStorage.setItem('lh_exp', result.exp);

                    btn.style.background = '#0f172a';
                    btn.style.color = '#ffffff';
                    btn.style.border = '1px solid rgba(255,255,255,0.2)';
                    btn.innerHTML = '<i class="bi bi-check2-circle" style="font-size:16px;"></i><span class="btn-text">Access Granted</span>';

                    setTimeout(() => {
                        const redirectTo = urlParams.get('next') || `/way_admin?node=${nodeId}`;
                        window.location.href = redirectTo;
                    }, 700);

                } else {
                    if (response.status === 401) {
                        showError('Invalid credentials — check your ID and PIN');
                    } else if (response.status === 403) {
                        showError('Account suspended — contact your administrator');
                    } else if (response.status === 429) {
                        showError('Too many attempts — try again in 5 minutes');
                    } else {
                        showError(result.message || 'Authentication failed');
                    }
                }

            } catch (err) {
                showError('Auth gateway unreachable — check connection');
                console.error('[Login Error]', err);
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
                document.getElementById('loginSpinner').style.display = 'none';
                if (btn.style.background !== 'rgb(15, 23, 42)') {
                    btn.innerHTML = `
                        <div class="spinner" id="loginSpinner"></div>
                        <span class="btn-text">Authenticate Session</span>
                        <i class="bi bi-arrow-right-short" style="font-size:16px;"></i>
                    `;
                }
            }
        }

        // ============================================================
        // ALREADY AUTHENTICATED? REDIRECT IMMEDIATELY
        // ============================================================
        (function checkExistingSession() {
            const token = sessionStorage.getItem('lh_token');
            const exp   = sessionStorage.getItem('lh_exp');
            const node  = sessionStorage.getItem('lh_node');
            if (token && exp && Date.now() / 1000 < Number(exp)) {
                window.location.href = `/way_admin?node=${node}`;
            }
        })();

        window.openSupportModal = function() {
    const modal = document.getElementById('supportModal');
    if (modal) {
        // PHYSICALLY RELOCATE: This pulls the modal out of any 
        // nested containers and puts it directly under <body>
        document.body.appendChild(modal); 
        
        // VISIBILITY: Force display properties
        modal.classList.remove('hidden');
        modal.style.display = 'flex';
        modal.style.zIndex = '999999';
        
        console.log("[Support] Modal moved to body root and z-index forced.");
    }
};

        window.closeSupportModal = function() {
    const modal = document.getElementById('supportModal');
    if (modal) {
        modal.classList.add('hidden');
        modal.style.display = 'none';
    }
};

    </script>

</body>
</html>
