<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Logistics Portal | Live Track</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Leaflet.js Mapping Infrastructure (Zero OpEx) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Google Fonts: DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --brand-primary: #3b82f6; 
            --brand-dark: #0f172a;
            --backmarket-green: #00FF85; 
        }

        body { 
            font-family: 'DM Sans', sans-serif; 
            background-color: #ffffff;
            color: var(--brand-dark);
            scroll-behavior: smooth;
        }

        .tracker-container {
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            border-width: 2px;
        }

        .tracker-expanded {
            width: 90%;
            max-width: 500px;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 100px;
            background: white;
            padding: 0.5rem;
            border-color: var(--backmarket-green);
        }
        
        @keyframes loading-sweep { 0% { left: -100%; } 100% { left: 100%; } }
        .loader-bar {
            position: absolute; top: 0; left: 0; height: 3px; width: 100%;
            background: linear-gradient(90deg, transparent, var(--brand-primary), transparent);
            animation: loading-sweep 1.5s infinite linear;
            display: none;
        }

        #liveMap { height: 100%; width: 100%; background: #f1f5f9; }
        .btn-brand { background-color: var(--brand-dark); color: white; transition: all 0.3s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        @media (max-width: 1024px) {
            .info-sheet {
                position: absolute; bottom: 0; left: 0; right: 0;
                background: #f8fafc; border-top-left-radius: 2.5rem; border-top-right-radius: 2.5rem;
                z-index: 2000; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
                box-shadow: 0 -10px 40px rgba(0,0,0,0.15); max-height: 85vh; overflow-y: auto;
            }
            .info-sheet.minimized { transform: translateY(calc(100% - 95px)); }
            .info-sheet.expanded { transform: translateY(0); }
        }

        /* Vertical Stepper Connector Line */
        .stepper-line {
            position: absolute;
            left: 19px;
            top: 40px;
            bottom: -32px;
            width: 2px;
            background-color: #e2e8f0;
            z-index: 0;
        }
    </style>
</head>
<body class="overflow-x-hidden">

    <!-- CONFIGURATION -->
    <script>
        const params = new URLSearchParams(window.location.search);
        const nodeParam = params.get('node');

        const CONFIG = {
            targetNode: (nodeParam || "swiftline-logistics").trim().toLowerCase(), 
            firebase: JSON.parse('{{ __firebase_config | safe if __firebase_config else "{}" }}')
        };

        if (!firebase.apps.length) firebase.initializeApp(CONFIG.firebase);
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        let currentMap = null;
        let mapMarker = null;
        let telemetryUnsubscribe = null;
        let lastKnownLat = null;
        let lastKnownLng = null;
        let lastKnownTimestamp = null; 
        let healthCheckInterval = null;
    </script>

    <!-- NAVIGATION -->
    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 py-4">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="bi bi-box-seam-fill"></i>
                </div>
                <span class="font-extrabold text-xl tracking-tight text-slate-900 uppercase" id="navBrandName">Tracking Portal</span>
            </div>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest" id="nodeIdentity">Node: ---</p>
        </div>
    </nav>

    <!-- HERO -->
    <section class="h-[60vh] lg:h-screen relative overflow-hidden flex items-center justify-center">
        <div class="absolute inset-0">
            <img src="https://images.unsplash.com/photo-1494412519320-aa613dfb7738?q=80&w=2000&auto=format&fit=crop" class="w-full h-full object-cover grayscale" alt="Warehouse">
            <div class="absolute inset-0 bg-blue-900/40 mix-blend-multiply"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-white via-transparent to-transparent"></div>
        </div>
        <div class="relative z-10 text-center px-6">
            <h3 class="text-5xl lg:text-9xl font-black text-white uppercase tracking-tighter mb-8 opacity-90">
                Live <span class="text-blue-400">Telemetry.</span>
            </h3>
            <p class="text-white/70 max-w-xl mx-auto font-medium text-lg leading-relaxed">Enter your waybill reference to open the autonomous visibility corridor.</p>
        </div>
    </section>

    <!-- FLOATING TRACKER -->
    <div id="tracker" class="fixed tracker-container tracker-expanded shadow-2xl flex items-center overflow-hidden">
        <div id="loaderBar" class="loader-bar"></div>
        <div class="search-content flex items-center w-full px-4 gap-3">
            <i class="bi bi-upc-scan text-slate-400 fs-5"></i>
            <input type="text" id="waybillInput" placeholder="ENTER WAYBILL ID" class="w-full bg-transparent border-none outline-none font-bold tracking-widest text-sm uppercase">
            <button id="trackBtn" onclick="handleTrack()" class="bg-blue-600 text-white px-6 py-2.5 rounded-full font-black text-[10px] uppercase tracking-widest hover:bg-blue-700 transition-all">Track</button>
        </div>
    </div>

    <!-- RESULT MODAL -->
    <div id="resultModal" class="fixed inset-0 z-[2000] hidden flex items-center justify-center p-2 lg:p-6 bg-slate-950/80 backdrop-blur-md">
        <div class="bg-white w-full max-w-[98vw] h-[95vh] lg:max-w-7xl lg:h-[85vh] rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col lg:flex-row relative">
            
            <button onclick="closeModal()" class="absolute top-6 right-6 z-[3000] w-12 h-12 bg-white/90 backdrop-blur rounded-full items-center justify-center hover:bg-white shadow-xl hidden lg:flex">
                <i class="bi bi-x-lg text-slate-900 fs-5"></i>
            </button>

            <!-- LEFT: INFO -->
            <div id="infoPane" class="info-sheet lg:w-[380px] lg:h-full lg:bg-slate-50 border-r border-slate-100 flex flex-col p-6 lg:p-10 minimized">
                <div class="lg:hidden">
                    <div class="flex items-center justify-between mb-6 px-2 pt-2">
                        <div id="mobileIdBadge" class="bg-white px-4 py-2 rounded-full border border-slate-200">
                             <h6 class="font-black text-xs tracking-widest text-slate-900" id="minimizedResID">--</h6>
                        </div>
                        <button onclick="toggleMobileSheet()" class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg transform transition-transform duration-300" id="mobileSheetBtn">
                            <i id="sheetToggleIcon" class="bi bi-chevron-up"></i>
                        </button>
                    </div>
                </div>

                <div id="modalDataContainer" class="flex-1 flex flex-col h-full">
                    <div class="mb-8">
                        <div class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full font-black text-[9px] uppercase tracking-widest border border-blue-100 mb-4 inline-block">Waybill Verified</div>
                        <h5 class="text-[10px] font-black text-slate-400 uppercase tracking-[3px] mb-1">Reference</h5>
                        <h2 class="text-3xl font-black text-slate-900 tracking-tighter" id="resID">--</h2>
                    </div>

                    <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm mb-8">
                        <div class="flex items-center justify-between mb-2">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Status</p>
                            <div id="liveBadge" class="bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full font-bold text-[9px] uppercase tracking-wider hidden animate-pulse">
                                <i class="bi bi-broadcast"></i> Watchdog Active
                            </div>
                        </div>
                        <h4 class="text-xl font-black text-slate-900" id="resStatus">Connecting...</h4>
                    </div>
                    
                    <!-- ENHANCED STEPPER UI -->
                    <div class="space-y-12 relative flex-1 no-scrollbar overflow-y-auto px-1">
                        <div id="step-1" class="flex gap-6 relative items-center opacity-30">
                            <div class="stepper-line"></div>
                            <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-400 z-10 border-4 border-white shadow-sm transition-colors duration-300">
                                <i class="bi bi-check-lg"></i>
                            </div>
                            <div><p class="font-black text-sm uppercase tracking-wider step-label">Registered</p></div>
                        </div>
                        <div id="step-2" class="flex gap-6 relative items-center opacity-30">
                            <div class="stepper-line"></div>
                            <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-400 z-10 border-4 border-white shadow-sm transition-colors duration-300">
                                <i class="bi bi-truck"></i>
                            </div>
                            <div><p class="font-black text-sm uppercase tracking-wider step-label">In Transit</p></div>
                        </div>
                        <div id="step-3" class="flex gap-6 relative items-center opacity-30">
                            <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-400 z-10 border-4 border-white shadow-sm transition-colors duration-300">
                                <i class="bi bi-flag-fill"></i>
                            </div>
                            <div><p class="font-black text-sm uppercase tracking-wider step-label">Arrived</p></div>
                        </div>
                    </div>
                </div>

                <div id="modalNotFound" class="hidden text-center py-20">
                    <h4 class="font-black text-slate-900 uppercase">Not Found</h4>
                    <p class="text-sm text-slate-400 mt-2 font-bold">Check your reference ID.</p>
                </div>
            </div>

            <!-- RIGHT: MAP -->
            <div class="flex-1 h-full relative">
                <button onclick="closeModal()" class="absolute top-6 left-6 z-[3000] w-12 h-12 bg-white/90 backdrop-blur rounded-full flex items-center justify-center shadow-xl border lg:hidden"><i class="bi bi-x-lg"></i></button>
                <div id="liveMap"></div>
                <div class="absolute bottom-32 lg:bottom-6 right-6 z-[1000]">
                    <div class="bg-white/90 backdrop-blur p-4 rounded-3xl shadow-2xl border border-white/50 w-48">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1" id="signalLabel">Satellite Link</p>
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="signalDot"></div>
                            <span class="font-black text-[10px] text-slate-900 uppercase" id="signalStatus">Monitoring...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tracker = document.getElementById('tracker');
        let sheetExpanded = false;

        document.getElementById('nodeIdentity').innerText = "Node: " + CONFIG.targetNode.toUpperCase();

        function toggleMobileSheet() {
            const pane = document.getElementById('infoPane');
            const icon = document.getElementById('sheetToggleIcon');
            const btn = document.getElementById('mobileSheetBtn');
            sheetExpanded = !sheetExpanded;
            
            if(sheetExpanded) {
                pane.classList.replace('minimized', 'expanded');
                icon.classList.replace('bi-chevron-up', 'bi-chevron-down');
                btn.classList.replace('bg-blue-600', 'bg-slate-900');
            } else {
                pane.classList.replace('expanded', 'minimized');
                icon.classList.replace('bi-chevron-down', 'bi-chevron-up');
                btn.classList.replace('bg-slate-900', 'bg-blue-600');
            }
        }

        function initMap(lat, lng) {
            if (currentMap) currentMap.remove();
            currentMap = L.map('liveMap', { 
                zoomControl: false, 
                attributionControl: true,
                scrollWheelZoom: true 
            }).setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OSM contributors'
            }).addTo(currentMap);
            const icon = L.divIcon({
                html: `<div style="background-color: #3b82f6; width: 18px; height: 18px; border-radius: 50%; border: 4px solid white; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);"></div>`,
                iconSize: [18, 18], iconAnchor: [9, 9]
            });
            mapMarker = L.marker([lat, lng], { icon }).addTo(currentMap);
        }

        async function handleTrack() {
            const id = document.getElementById('waybillInput').value.trim().toUpperCase();
            if(!id) return;
            document.getElementById('loaderBar').style.display = 'block';
            try {
                await auth.signInAnonymously();
                const snap = await db.collection(`artifacts/${CONFIG.targetNode}/public/data/logistics_packages`).get();
                const pkgDoc = snap.docs.find(d => d.data().waybillId === id);
                if (!pkgDoc) showModalError();
                else {
                    const data = pkgDoc.data();
                    renderModalResult(id, data);
                    if (data.batchId) syncTelemetry(data.batchId);
                }
            } catch (err) { console.error(err); showModalError(); }
            finally { document.getElementById('loaderBar').style.display = 'none'; }
        }

        function syncTelemetry(batchId) {
            db.collection(`artifacts/${CONFIG.targetNode}/public/data/logistics_batches`).doc(batchId).get().then(doc => {
                if (!doc.exists) return;
                const vehicleTag = doc.data().vehicleTag;

                db.collection(`artifacts/${CONFIG.targetNode}/public/data/delivery_sessions`).onSnapshot(snap => {
                    const activeSession = snap.docs.find(d => 
                        d.data().vehicleTag === vehicleTag && 
                        (d.data().status === 'ACTIVE' || d.data().status === 'DELAY - FAULT')
                    );
                    
                    if (activeSession) {
                        const sessionData = activeSession.data();
                        const isFaultMode = sessionData.status === 'DELAY - FAULT';

                        const signalDot = document.getElementById('signalDot');
                        const signalStatus = document.getElementById('signalStatus');
                        
                        if (isFaultMode) {
                            signalStatus.innerText = "Reporting Fault";
                            signalStatus.classList.add('text-amber-500');
                            signalDot.classList.replace('bg-emerald-500', 'bg-amber-500');
                        } else {
                            signalStatus.innerText = "Verified Stream Active";
                            signalStatus.classList.remove('text-amber-500');
                        }

                        if (telemetryUnsubscribe) telemetryUnsubscribe();
                        
                        if (healthCheckInterval) clearInterval(healthCheckInterval);
                        healthCheckInterval = setInterval(() => {
                            if (!lastKnownTimestamp) return;
                            const now = Date.now() / 1000;
                            const ageInSeconds = now - lastKnownTimestamp;
                            const dot = document.getElementById('signalDot');
                            const statusLabel = document.getElementById('signalStatus');

                            if (ageInSeconds > 240) {
                                statusLabel.innerText = isFaultMode ? "Fault/Signal Lost" : "Signal Suspended";
                                dot.classList.replace('bg-emerald-500', 'bg-amber-500');
                                dot.classList.replace('bg-blue-500', 'bg-amber-500');
                            }
                        }, 10000);

                        telemetryUnsubscribe = db.collection(`artifacts/${CONFIG.targetNode}/public/data/delivery_sessions`)
                            .doc(activeSession.id).collection('location_logs').onSnapshot(logSnap => {
                                const logs = logSnap.docs.map(l => ({
                                    ...l.data(),
                                    isPending: !l.data().timestamp
                                }))
                                .filter(l => l.lat && l.lng)
                                .sort((a, b) => {
                                    if (a.isPending) return -1;
                                    if (b.isPending) return 1;
                                    return (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0);
                                });

                                if (logs.length > 0) {
                                    const latest = logs[0];
                                    if (latest.lat !== lastKnownLat || latest.lng !== lastKnownLng) {
                                        lastKnownLat = latest.lat;
                                        lastKnownLng = latest.lng;
                                        updateMap(latest.lat, latest.lng);
                                    }
                                    
                                    let displayTime;
                                    if (latest.isPending) {
                                        displayTime = "Just Now";
                                        lastKnownTimestamp = Date.now() / 1000; 
                                    } else if (latest.timestamp) {
                                        const serverDate = new Date(latest.timestamp.seconds * 1000);
                                        displayTime = serverDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                        lastKnownTimestamp = latest.timestamp.seconds; 
                                    }

                                    document.getElementById('liveBadge').classList.remove('hidden');
                                    document.getElementById('signalLabel').innerText = "Last Pulse: " + displayTime;
                                    if (!isFaultMode) {
                                        document.getElementById('signalStatus').innerText = "Verified Stream Active";
                                        signalDot.classList.replace('bg-amber-500', 'bg-emerald-500');
                                    }
                                }
                            });
                    }
                });
            });
        }

        function updateMap(lat, lng) {
            if (lat === 5.6037 && lng === -0.1870 && currentMap && mapMarker.getLatLng().lat !== 5.6037) return;
            if (!currentMap) initMap(lat, lng);
            else { 
                mapMarker.setLatLng([lat, lng]); 
                currentMap.flyTo([lat, lng], 16, { animate: true, duration: 1.5 });
            }
        }

        function renderModalResult(id, data) {
            document.getElementById('resultModal').classList.remove('hidden');
            document.getElementById('modalNotFound').classList.add('hidden');
            document.getElementById('modalDataContainer').classList.remove('hidden');
            document.getElementById('resID').innerText = id;
            document.getElementById('minimizedResID').innerText = id;
            
            const statusText = data.status || "In Transit";
            document.getElementById('resStatus').innerText = statusText;
            
            if (statusText.includes('DELAY')) {
                document.getElementById('resStatus').className = "text-xl font-black text-amber-500";
            } else {
                document.getElementById('resStatus').className = "text-xl font-black text-slate-900";
            }
            
            const status = (data.status || "").toLowerCase();
            let step = 0;
            if (status.includes('registered')) step = 1;
            if (status.includes('transit') || status.includes('delay')) step = 2;
            if (status.includes('arrived')) step = 3;

            for(let i=1; i<=3; i++) {
                const el = document.getElementById(`step-${i}`);
                const iconBox = el.querySelector('div.w-10');
                const label = el.querySelector('.step-label');
                const line = el.querySelector('.stepper-line');
                
                el.classList.toggle('opacity-30', i > step);
                
                if (i <= step) {
                    let colorClass = 'bg-blue-600';
                    let textClass = 'text-blue-600';
                    let lineClass = 'bg-blue-600';
                    
                    if (i === step) {
                        if (status.includes('delay')) {
                            colorClass = 'bg-amber-500';
                            textClass = 'text-amber-500';
                            lineClass = 'bg-amber-200';
                        } else if (status.includes('arrived')) {
                            colorClass = 'bg-emerald-500';
                            textClass = 'text-emerald-600';
                            lineClass = 'bg-emerald-500';
                        }
                    } else {
                        // Previous steps already passed
                        if (status.includes('arrived')) {
                            colorClass = 'bg-emerald-500';
                            lineClass = 'bg-emerald-500';
                        }
                    }

                    iconBox.className = `w-10 h-10 rounded-full ${colorClass} flex items-center justify-center text-white z-10 border-4 border-white shadow-sm`;
                    label.className = `font-black text-sm uppercase tracking-wider step-label ${textClass}`;
                    if (line) line.className = `stepper-line ${lineClass}`;
                } else {
                    iconBox.className = `w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-400 z-10 border-4 border-white shadow-sm`;
                    label.className = `font-black text-sm uppercase tracking-wider step-label text-slate-400`;
                    if (line) line.className = `stepper-line bg-slate-100`;
                }
            }
            if(!currentMap) initMap(5.6037, -0.1870); 
        }

        function showModalError() {
            document.getElementById('resultModal').classList.remove('hidden');
            document.getElementById('modalDataContainer').classList.add('hidden');
            document.getElementById('modalNotFound').classList.remove('hidden');
        }

        window.closeModal = () => {
            document.getElementById('resultModal').classList.add('hidden');
            if(telemetryUnsubscribe) telemetryUnsubscribe();
            if(healthCheckInterval) clearInterval(healthCheckInterval);
            if(currentMap) { currentMap.remove(); currentMap = null; }
            lastKnownLat = null; lastKnownLng = null; lastKnownTimestamp = null;
        };
    </script>
</body>
</html>
